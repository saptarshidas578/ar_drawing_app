# gradle.properties — project-wide Gradle settings
# Use AndroidX libraries instead of old support libraries
android.useAndroidX=true
# Allow parallel module compilation for speed
org.gradle.parallel=true
# Give Gradle more memory
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Enable non-transitive R classes (smaller APK, faster builds)
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36,37
